
name: Android 9 cloud phone (API 28)
run-name: Android 9 cloud phone (${{ inputs.minutes || '120' }} min)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the cloud Android session alive (1-350 minutes)"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android 9 emulator and browser access
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_VNC_PASSWORD: ${{ secrets.ANDROID_VNC_PASSWORD }}
      MINUTES: ${{ inputs.minutes || '120' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android SDK (Android 9 / API 28)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator platforms;android-28 system-images;android-28;google_apis;x86_64'

      - name: Validate session settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 350 )); then
            echo "::error::Minutes must be between 1 and 350."
            exit 1
          fi
          if [[ -z "${ANDROID_VNC_PASSWORD:-}" ]]; then
            echo "::error::Add the ANDROID_VNC_PASSWORD secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if (( ${#ANDROID_VNC_PASSWORD} < 1 || ${#ANDROID_VNC_PASSWORD} > 8 )); then
            echo "::error::ANDROID_VNC_PASSWORD must contain 1-8 characters for VNC."
            exit 1
          fi
          echo "Session duration: ${MINUTES} minutes."

      - name: Enable emulator acceleration when available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM acceleration is available."
            else
              echo "::warning::KVM is present but unavailable; emulator may be slower."
            fi
          else
            echo "::warning::KVM is unavailable; Android may boot slowly."
          fi

      - name: Install browser desktop, tunnel tools, and emulator runtime libraries
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          APT_OPTS=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=15
            -o Acquire::https::Timeout=15
          )

          echo "Updating Ubuntu package lists..."
          timeout 180s sudo apt-get "${APT_OPTS[@]}" update -y

          echo "Installing VNC, browser, and emulator dependencies..."
          timeout 300s sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            xvfb x11vnc novnc websockify x11-utils netcat-openbsd \
            curl wget ca-certificates libpulse0

          echo "Downloading Cloudflare Tunnel..."
          timeout 120s wget --tries=2 --timeout=30 -q \
            -O cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb
          echo "All browser and emulator dependencies installed."

      - name: Start browser desktop bridge (60 FPS polling target)
        shell: bash
        env:
          DISPLAY: ':99'
        run: |
          set -Eeuo pipefail
          PASSFILE="$RUNNER_TEMP/vnc.pass"

          Xvfb "$DISPLAY" -screen 0 1280x800x24 \
            -ac +extension GLX +render -noreset > xvfb.log 2>&1 &

          for i in {1..30}; do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 1
          done

          if ! xdpyinfo -display "$DISPLAY" >/dev/null 2>&1; then
            echo "::error::Xvfb failed to start."
            cat xvfb.log || true
            exit 1
          fi

          x11vnc -storepasswd "$ANDROID_VNC_PASSWORD" "$PASSFILE" >/dev/null
          chmod 600 "$PASSFILE"

          # 16 ms polling targets up to roughly 60 screen polls per second.
          # Actual frame rate depends on the host, emulator, and browser connection.
          x11vnc -display "$DISPLAY" -localhost -forever -shared \
            -rfbport 5900 -rfbauth "$PASSFILE" \
            -wait 16 -wait_ui 1 -defer 5 -nowait_bog \
            > x11vnc.log 2>&1 &

          for i in {1..30}; do
            nc -z 127.0.0.1 5900 >/dev/null 2>&1 && break
            sleep 1
          done

          if ! nc -z 127.0.0.1 5900 >/dev/null 2>&1; then
            echo "::error::VNC failed to start."
            cat x11vnc.log || true
            exit 1
          fi

          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 \
            > novnc.log 2>&1 &

          for i in {1..30}; do
            curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null && break
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
            echo "::error::noVNC failed to start."
            cat novnc.log || true
            exit 1
          fi

          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          echo "Browser desktop bridge is ready."

      - name: Create and boot low-resolution Android 9 emulator at 60 Hz
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | avdmanager create avd \
            --force \
            --name mobile-test \
            --package 'system-images;android-28;google_apis;x86_64' \
            --device pixel_2

          AVD_CONFIG="$ANDROID_AVD_HOME/mobile-test.avd/config.ini"

          if [[ ! -f "$AVD_CONFIG" ]]; then
            echo "::error::Could not find AVD config at $AVD_CONFIG"
            exit 1
          fi

          # Change resolution and refresh target, not density.
          set_avd_config() {
            local key="$1" value="$2"
            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          set_avd_config hw.lcd.width 320
          set_avd_config hw.lcd.height 480
          set_avd_config hw.lcd.depth 16
          set_avd_config hw.lcd.vsync 60
          set_avd_config hw.cpu.ncore 2
          set_avd_config hw.ramSize 2048
          set_avd_config vm.heapSize 128
          set_avd_config showDeviceFrame no

          echo "AVD display configuration:"
          grep -E '^(hw\.lcd\.(width|height|depth|vsync)|hw\.cpu\.ncore|hw\.ramSize|vm\.heapSize|showDeviceFrame)=' "$AVD_CONFIG"

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ACCEL=(-accel on)
          else
            ACCEL=(-accel off)
          fi

          nohup "$ANDROID_HOME/emulator/emulator" @mobile-test \
            -no-audio -no-boot-anim -no-snapshot -gpu auto \
            -memory 2048 -cores 2 "${ACCEL[@]}" > emulator.log 2>&1 &

          if ! timeout 240 adb wait-for-device; then
            echo "::error::Android 9 emulator did not connect to ADB within 240 seconds."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi

          if ! timeout 600 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo "::error::Android 9 did not finish booting within 10 minutes."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi

          # Apply the low guest resolution. Leave density at its default.
          adb shell wm size 320x480
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

          echo "Android 9 booted at 320x480, with default DPI and 60 Hz target."

      - name: Publish temporary browser URL
        shell: bash
        run: |
          set -Eeuo pipefail

          cloudflared tunnel --no-autoupdate \
            --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &

          DESKTOP_URL=""
          for i in {1..60}; do
            DESKTOP_URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' \
              cloudflared.log | head -n 1 || true)"
            [[ -n "$DESKTOP_URL" ]] && break
            sleep 2
          done

          if [[ -z "$DESKTOP_URL" ]]; then
            echo "::error::Cloudflare did not provide a temporary URL."
            cat cloudflared.log || true
            exit 1
          fi

          ACCESS_URL="$DESKTOP_URL/vnc.html?autoconnect=true&resize=scale&path=websockify"

          {
            echo "## Android 9 emulator browser session"
            echo
            echo "**Open:** [$ACCESS_URL]($ACCESS_URL)"
            echo
            echo "Enter the password stored in the repository secret ANDROID_VNC_PASSWORD."
            echo
            echo "Android 9 / API 28; 320x480 resolution; default DPI; 60 Hz refresh target."
            echo "Screen polling targets about 60 polls per second, but actual FPS may be lower."
            echo
            echo "This URL is temporary and works only while this workflow run is active."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Android 9 emulator URL: $ACCESS_URL"
          echo "::notice title=Android 9 emulator URL::$ACCESS_URL"

      - name: Verify Android version and display settings
        shell: bash
        run: |
          set -euo pipefail
          adb devices -l
          echo "Android version: $(adb -s emulator-5554 shell getprop ro.build.version.release | tr -d '\r')"
          echo "SDK/API level: $(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "Display size: $(adb -s emulator-5554 shell wm size | tail -n 1 | tr -d '\r')"
          echo "Display density (device default): $(adb -s emulator-5554 shell wm density | tr -d '\r')"

      - name: Keep session alive
        shell: bash
        timeout-minutes: 350
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "Android 9 session is available for ${MINUTES} minutes."

          while (( $(date +%s) < END )); do
            adb -s emulator-5554 get-state >/dev/null
            sleep 60
          done

      - name: Upload diagnostic logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-9-emulator-logs
          path: |
            emulator.log
            xvfb.log
            x11vnc.log
            novnc.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 1
