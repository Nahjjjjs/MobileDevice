          AVD_CONFIG="$ANDROID_AVD_HOME/mobile-test.avd/config.ini"
          if [[ ! -f "$AVD_CONFIG" ]]; then
            echo "::error::Could not find AVD config at $AVD_CONFIG"
            exit 1
          fi

          # Update existing AVD properties rather than appending duplicates.
          set_avd_config() {
            local key="$1" value="$2"
            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          set_avd_config hw.lcd.width 320
          set_avd_config hw.lcd.height 480
          set_avd_config hw.lcd.density 120
          set_avd_config hw.lcd.depth 16
          set_avd_config hw.lcd.vsync 30
          set_avd_config hw.cpu.ncore 2
          set_avd_config hw.ramSize 2048
          set_avd_config vm.heapSize 128
          set_avd_config showDeviceFrame no

          echo "AVD display config:"
          grep -E '^(hw\.lcd\.(width|height|density|depth|vsync)|hw\.cpu\.ncore|hw\.ramSize|vm\.heapSize|showDeviceFrame)=' "$AVD_CONFIG"

          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ACCEL=(-accel on)
          else
            # Recent emulator versions require opting in before software emulation.
            export ANDROID_I_WANT_MY_TCG=yes
            ACCEL=(-accel off)
          fi

          nohup "$ANDROID_HOME/emulator/emulator" @mobile-test \
            -no-audio -no-boot-anim -no-snapshot -gpu auto \
            -memory 2048 -cores 2 "${ACCEL[@]}" > emulator.log 2>&1 &

          if ! timeout 240 adb wait-for-device; then
            echo "::error::Android 9 emulator did not connect to ADB within 240 seconds."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi

          if ! timeout 600 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo "::error::Android 9 did not finish booting within 10 minutes."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi

          # Apply low guest resolution/density after boot as a second safeguard.
          adb shell wm size 320x480
          adb shell wm density 120
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true

          echo "Android 9 emulator booted with low-resolution display overrides."

      - name: Publish temporary browser URL
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          DESKTOP_URL=""
          for i in {1..60}; do
            DESKTOP_URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            [[ -n "$DESKTOP_URL" ]] && break
            sleep 2
          done
          if [[ -z "$DESKTOP_URL" ]]; then
            echo "::error::Cloudflare did not provide a temporary URL."
            cat cloudflared.log || true
            exit 1
          fi
          ACCESS_URL="$DESKTOP_URL/vnc.html?autoconnect=true&resize=scale&path=websockify"
          {
            echo "## Android 9 emulator browser session"
            echo
            echo "**Open:** [$ACCESS_URL]($ACCESS_URL)"
            echo
            echo "Enter the password stored in the repository secret ANDROID_VNC_PASSWORD."
            echo
            echo "Android 9 / API 28; guest display target 320x480 at 120 DPI; AVD VSYNC target 30 Hz."
            echo "The VNC framebuffer polling interval is 33 ms (about 30 updates/second). Actual rate depends on runner load and browser/network performance."
            echo
            echo "This URL is temporary and only works while this workflow run is active."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Android 9 emulator URL: $ACCESS_URL"
          echo "::notice title=Android 9 emulator URL::$ACCESS_URL"

      - name: Verify Android version and display settings
        shell: bash
        run: |
          set -euo pipefail
          adb devices -l
          echo "Android version: $(adb -s emulator-5554 shell getprop ro.build.version.release | tr -d '\r')"
          echo "SDK/API level: $(adb -s emulator-5554 shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "Display size: $(adb -s emulator-5554 shell wm size | tail -n 1 | tr -d '\r')"
          echo "Display density: $(adb -s emulator-5554 shell wm density | tail -n 1 | tr -d '\r')"

      - name: Keep session alive
        shell: bash
        timeout-minutes: 350
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "Android 9 session is available for ${MINUTES} minutes."
          while (( $(date +%s) < END )); do
            adb -s emulator-5554 get-state >/dev/null
            sleep 60
          done

      - name: Upload diagnostic logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-9-emulator-logs
          path: |
            emulator.log
            xvfb.log
            x11vnc.log
            novnc.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 1
