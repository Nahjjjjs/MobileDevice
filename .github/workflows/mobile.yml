name: Mobile device test

# Manual only. The public tunnel never opens on push or PR.
on:
  workflow_dispatch:
    inputs:
      device:
        description: "Phone model"
        type: choice
        default: pixel_5
        options:
          # --- Google hardware profiles (real AVD profiles) ---
          - pixel
          - pixel_xl
          - pixel_2
          - pixel_2_xl
          - pixel_3
          - pixel_3_xl
          - pixel_3a
          - pixel_3a_xl
          - pixel_4
          - pixel_4_xl
          - pixel_4a
          - pixel_5
          - pixel_6
          - pixel_6_pro
          - pixel_6a
          - pixel_7
          - pixel_7_pro
          - pixel_fold
          - pixel_tablet
          - pixel_c
          # --- Other brands (screen size + density only) ---
          - galaxy_s23
          - galaxy_s21
          - galaxy_s20_fe
          - galaxy_a54
          - galaxy_a34
          - galaxy_a14
          - galaxy_a04
          - galaxy_z_flip
          - redmi_note_12
          - redmi_note_11
          - redmi_9a
          - poco_f5
          - poco_x5
          - oppo_reno8
          - oppo_a57
          - vivo_v27
          - vivo_y20
          - realme_c55
          - realme_c11
          - oneplus_nord
          - tecno_spark_10
          - infinix_hot_30
          - moto_g_power
          - moto_e13
          - low_end_720p
          - mid_1080p
          - hi_res_1440p
      apk_url:
        description: "Optional: direct APK link to install after boot"
        required: false
        default: ""
      minutes:
        description: "Session length in minutes (max 330)"
        default: "120"

permissions:
  contents: read

jobs:
  android13:
    name: Android 13 (API 33) on ${{ inputs.device }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      SESSION_MINUTES: ${{ inputs.minutes }}
      APK_URL: ${{ inputs.apk_url }}

    steps:
      - name: Require VNC_PASSWORD
        run: |
          if [ -z "$VNC_PASSWORD" ]; then
            echo "::error::Add a VNC_PASSWORD repository secret first."
            exit 1
          fi

      - name: Resolve device
        env:
          CHOICE: ${{ inputs.device }}
        run: |
          PROFILE=pixel_5; SIZE=""; DENSITY=""
          case "$CHOICE" in
            pixel|pixel_*)   PROFILE="$CHOICE" ;;
            galaxy_s23)      SIZE=1080x2340; DENSITY=425 ;;
            galaxy_s21)      SIZE=1080x2400; DENSITY=421 ;;
            galaxy_s20_fe)   SIZE=1080x2400; DENSITY=407 ;;
            galaxy_a54)      SIZE=1080x2340; DENSITY=403 ;;
            galaxy_a34)      SIZE=1080x2340; DENSITY=390 ;;
            galaxy_a14)      SIZE=1080x2408; DENSITY=400 ;;
            galaxy_a04)      SIZE=720x1600;  DENSITY=270 ;;
            galaxy_z_flip)   SIZE=1080x2640; DENSITY=425 ;;
            redmi_note_12)   SIZE=1080x2400; DENSITY=395 ;;
            redmi_note_11)   SIZE=1080x2400; DENSITY=409 ;;
            redmi_9a)        SIZE=720x1600;  DENSITY=270 ;;
            poco_f5)         SIZE=1080x2400; DENSITY=440 ;;
            poco_x5)         SIZE=1080x2400; DENSITY=395 ;;
            oppo_reno8)      SIZE=1080x2412; DENSITY=400 ;;
            oppo_a57)        SIZE=720x1612;  DENSITY=320 ;;
            vivo_v27)        SIZE=1080x2400; DENSITY=400 ;;
            vivo_y20)        SIZE=720x1600;  DENSITY=270 ;;
            realme_c55)      SIZE=1080x2400; DENSITY=400 ;;
            realme_c11)      SIZE=720x1600;  DENSITY=270 ;;
            oneplus_nord)    SIZE=1080x2400; DENSITY=410 ;;
            tecno_spark_10)  SIZE=720x1612;  DENSITY=320 ;;
            infinix_hot_30)  SIZE=720x1640;  DENSITY=300 ;;
            moto_g_power)    SIZE=720x1600;  DENSITY=280 ;;
            moto_e13)        SIZE=720x1600;  DENSITY=270 ;;
            low_end_720p)    SIZE=720x1280;  DENSITY=320 ;;
            mid_1080p)       SIZE=1080x1920; DENSITY=420 ;;
            hi_res_1440p)    SIZE=1440x2560; DENSITY=560 ;;
            *) echo "::error::Unknown device $CHOICE"; exit 1 ;;
          esac
          {
            echo "PROFILE=$PROFILE"
            echo "WM_SIZE=$SIZE"
            echo "WM_DENSITY=$DENSITY"
            echo "DEVICE_NAME=$CHOICE"
          } >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install display stack
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb x11vnc novnc websockify scrcpy socat
          sudo curl -fsSL -o /usr/local/bin/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo chmod +x /usr/local/bin/cloudflared

      # Optional: native scrcpy from your own machine over Tailscale.
      - name: Join tailnet
        if: env.TAILSCALE_AUTHKEY != ''
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # The emulator runner executes `script:` one line at a time, so the
      # session logic is written to a file here and run as a single command.
      - name: Write session script
        run: |
          cat > /tmp/session.sh <<'SESSION_EOF'
          #!/usr/bin/env bash
          set -uo pipefail

          export ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ADB="$ANDROID_SDK/platform-tools/adb"
          export PATH="$ANDROID_SDK/platform-tools:$PATH"
          export DISPLAY=:99
          export SDL_RENDER_DRIVER=software

          MINUTES="${SESSION_MINUTES:-120}"
          [ "$MINUTES" -gt 330 ] && MINUTES=330
          SERIAL="emulator-5554"

          # 1. confirm Android 13
          adb -s "$SERIAL" wait-for-device
          REL=$(adb -s "$SERIAL" shell getprop ro.build.version.release | tr -d '\r')
          SDK=$(adb -s "$SERIAL" shell getprop ro.build.version.sdk | tr -d '\r')
          ABIS=$(adb -s "$SERIAL" shell getprop ro.product.cpu.abilist | tr -d '\r')
          echo "Android $REL (API $SDK), ABIs: $ABIS"
          if [ "$REL" != "13" ]; then
            echo "::error::Expected Android 13, got $REL"
            exit 1
          fi
          adb -s "$SERIAL" shell settings put global stay_on_while_plugged_in 7
          adb -s "$SERIAL" shell input keyevent KEYCODE_WAKEUP

          # 2. imitate non-Google models: override screen size + density
          if [ -n "${WM_SIZE:-}" ]; then
            adb -s "$SERIAL" shell wm size "$WM_SIZE"
            adb -s "$SERIAL" shell wm density "$WM_DENSITY"
            sleep 3
          fi

          # 3. optional APK install
          if [ -n "${APK_URL:-}" ]; then
            echo "Downloading APK"
            if curl -fsSL -o /tmp/app.apk "$APK_URL"; then
              adb -s "$SERIAL" install -r -g /tmp/app.apk || echo "::warning::APK install failed"
            else
              echo "::warning::APK download failed"
            fi
          fi

          # 4. size the virtual screen to the model (long edge = 1280)
          RES=$(adb -s "$SERIAL" shell wm size | grep -o '[0-9]*x[0-9]*' | tail -n1)
          PW=${RES%x*}; PH=${RES#*x}
          MAX=1280
          if [ "$PW" -ge "$PH" ]; then
            SW=$MAX; SH=$(( PH * MAX / PW ))
          else
            SH=$MAX; SW=$(( PW * MAX / PH ))
          fi
          SW=$(( SW / 2 * 2 )); SH=$(( SH / 2 * 2 ))
          echo "Panel ${PW}x${PH} -> display ${SW}x${SH}"

          Xvfb :99 -screen 0 ${SW}x${SH}x24 -nolisten tcp &
          sleep 2
          (
            while true; do
              scrcpy -s "$SERIAL" --max-size "$MAX" --window-x 0 --window-y 0 \
                     --window-borderless --stay-awake >/tmp/scrcpy.log 2>&1
              sleep 2
            done
          ) &

          # 5. VNC (password) -> noVNC -> public tunnel
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vncpass >/dev/null 2>&1
          x11vnc -display :99 -rfbauth /tmp/vncpass -forever -shared -localhost \
                 -rfbport 5900 -quiet -bg -o /tmp/x11vnc.log

          websockify --web /usr/share/novnc 6080 localhost:5900 >/tmp/websockify.log 2>&1 &
          sleep 2

          cloudflared tunnel --url http://localhost:6080 --no-autoupdate >/tmp/cloudflared.log 2>&1 &

          URL=""
          for _ in $(seq 1 45); do
            URL=$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "::error::Tunnel failed to start"
            cat /tmp/cloudflared.log
            exit 1
          fi

          FULL="$URL/vnc.html?autoconnect=true&resize=scale&reconnect=true"
          echo "::notice title=Android 13 URL::$FULL"
          {
            echo "## Android 13 emulator browser session"
            echo
            echo "Model: \`${DEVICE_NAME:-unknown}\` (${PW}x${PH}), ABIs: \`${ABIS}\`"
            echo
            echo "[Open]($FULL)"
            echo
            echo "Password: your \`VNC_PASSWORD\` secret. Session ends in ${MINUTES} min."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

          # 6. optional: native scrcpy over Tailscale
          if command -v tailscale >/dev/null 2>&1 && [ -n "${TAILSCALE_AUTHKEY:-}" ]; then
            TS_IP=$(tailscale ip -4 | head -n1)
            socat TCP-LISTEN:5556,fork,reuseaddr,bind="$TS_IP" TCP:127.0.0.1:5555 &
            {
              echo
              echo "### Native scrcpy (Tailscale)"
              echo '```'
              echo "adb connect $TS_IP:5556"
              echo "scrcpy -s $TS_IP:5556"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

          # 7. hold the session open
          END=$((SECONDS + MINUTES * 60))
          while [ "$SECONDS" -lt "$END" ]; do
            if ! adb -s "$SERIAL" get-state >/dev/null 2>&1; then
              echo "Emulator went away, ending session."
              break
            fi
            sleep 20
          done
          echo "Session over."
          SESSION_EOF
          chmod +x /tmp/session.sh

      - name: Boot Android 13 and serve it
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis_playstore   # Play Store image: includes ARM app translation
          arch: x86_64
          profile: ${{ env.PROFILE }}
          cores: 4
          ram-size: 6144M
          heap-size: 576M
          disk-size: 12G
          force-avd-creation: true
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash /tmp/session.sh
