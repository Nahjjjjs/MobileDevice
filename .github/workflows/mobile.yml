
      - name: Install browser tools and emulator runtime libraries
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail

          APT_OPTS=(
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=10
            -o Acquire::https::Timeout=10
          )

          echo "Updating package lists..."
          timeout 90s sudo apt-get "${APT_OPTS[@]}" update -y

          echo "Installing emulator dependencies..."
          timeout 180s sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get "${APT_OPTS[@]}" install -y --no-install-recommends \
            xvfb x11vnc novnc websockify x11-utils \
            netcat-openbsd curl wget ca-certificates libpulse0

          echo "Downloading Cloudflare Tunnel..."
          timeout 90s wget --tries=2 --timeout=20 -q \
            -O cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb

          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

          echo "Dependencies installed successfully."
