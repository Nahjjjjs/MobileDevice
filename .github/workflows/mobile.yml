
name: Mobile device test

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the cloud Android session alive (1-350 minutes)"
        required: true
        default: "120"
        type: string

permissions:
  contents: read

concurrency:
  group: cloud-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-emulator:
    name: Android emulator and browser access
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ANDROID_VNC_PASSWORD: ${{ secrets.ANDROID_VNC_PASSWORD }}
      MINUTES: ${{ inputs.minutes || '120' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools emulator platforms;android-30 system-images;android-30;google_apis;x86_64'

      - name: Validate session settings
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MINUTES" =~ ^[0-9]+$ ]] || (( MINUTES < 1 || MINUTES > 350 )); then
            echo "::error::Minutes must be a number from 1 to 350."
            exit 1
          fi
          if [[ -z "${ANDROID_VNC_PASSWORD:-}" ]]; then
            echo "::error::Add the ANDROID_VNC_PASSWORD secret in Settings > Secrets and variables > Actions."
            exit 1
          fi
          if (( ${#ANDROID_VNC_PASSWORD} < 1 || ${#ANDROID_VNC_PASSWORD} > 8 )); then
            echo "::error::ANDROID_VNC_PASSWORD must be 1-8 characters because of VNC password limits."
            exit 1
          fi
          echo "Session duration: ${MINUTES} minutes."

      - name: Enable emulator acceleration when available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM acceleration is available."
            else
              echo "::warning::KVM is present but unavailable to the runner user."
            fi
          else
            echo "::warning::KVM is not available; Android may boot slowly."
          fi

      - name: Install browser desktop and tunnel tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xvfb x11vnc novnc websockify x11-utils netcat-openbsd curl wget ca-certificates
          wget -q -O cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Start browser desktop bridge
        shell: bash
        env:
          DISPLAY: ':99'
        run: |
          set -Eeuo pipefail
          PASSFILE="$RUNNER_TEMP/vnc.pass"
          mkdir -p "$HOME/.cache/mobiledevice"
          Xvfb "$DISPLAY" -screen 0 1280x800x24 -ac +extension GLX +render -noreset > xvfb.log 2>&1 &
          for i in {1..30}; do
            xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
            sleep 1
          done
          xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 || {
            echo "::error::Xvfb did not start."
            cat xvfb.log || true
            exit 1
          }
          x11vnc -storepasswd "$ANDROID_VNC_PASSWORD" "$PASSFILE" >/dev/null
          chmod 600 "$PASSFILE"
          x11vnc -display "$DISPLAY" -localhost -forever -shared -rfbport 5900 \
            -rfbauth "$PASSFILE" > x11vnc.log 2>&1 &
          for i in {1..30}; do
            nc -z 127.0.0.1 5900 >/dev/null 2>&1 && break
            sleep 1
          done
          nc -z 127.0.0.1 5900 >/dev/null 2>&1 || {
            echo "::error::x11vnc did not start."
            cat x11vnc.log || true
            exit 1
          }
          websockify --web=/usr/share/novnc 6080 127.0.0.1:5900 > novnc.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null || {
            echo "::error::noVNC did not start."
            cat novnc.log || true
            exit 1
          }
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          echo "Browser desktop bridge is ready."

      - name: Create and boot Android 11 emulator
        shell: bash
        run: |
          set -Eeuo pipefail
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd \
            --force \
            --name mobile-test \
            --package 'system-images;android-30;google_apis;x86_64' \
            --device pixel_2
          if [[ -r /dev/kvm && -w /dev/kvm ]]; then
            ACCEL=(-accel on)
          else
            ACCEL=(-accel off)
          fi
          nohup "$ANDROID_HOME/emulator/emulator" @mobile-test \
            -no-audio -no-boot-anim -no-snapshot -gpu auto \
            -memory 4096 -cores 4 "${ACCEL[@]}" > emulator.log 2>&1 &
          if ! timeout 240 adb wait-for-device; then
            echo "::error::The emulator did not connect to ADB within 240 seconds."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi
          if ! timeout 600 bash -c \
            'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo "::error::Android did not finish booting within 10 minutes."
            adb devices -l || true
            cat emulator.log || true
            exit 1
          fi
          sleep 10
          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          echo "Android emulator booted."

      - name: Publish temporary browser URL
        shell: bash
        run: |
          set -Eeuo pipefail
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 > cloudflared.log 2>&1 &
          DESKTOP_URL=""
          for i in {1..60}; do
            DESKTOP_URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' cloudflared.log | head -n 1 || true)"
            [[ -n "$DESKTOP_URL" ]] && break
            sleep 2
          done
          if [[ -z "$DESKTOP_URL" ]]; then
            echo "::error::Cloudflare did not provide a temporary URL."
            cat cloudflared.log || true
            exit 1
          fi
          ACCESS_URL="$DESKTOP_URL/vnc.html?autoconnect=true&resize=scale&path=websockify"
          {
            echo "## Android emulator browser session"
            echo
            echo "**Open:** [$ACCESS_URL]($ACCESS_URL)"
            echo
            echo "Enter the password stored in the repository secret ANDROID_VNC_PASSWORD."
            echo
            echo "The URL is temporary and works only while this workflow run is active."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Android emulator URL: $ACCESS_URL"
          echo "::notice title=Android emulator URL::$ACCESS_URL"

      - name: Verify emulator
        shell: bash
        run: |
          set -euo pipefail
          adb devices
          echo "Android version: $(adb -s emulator-5554 shell getprop ro.build.version.release | tr -d '\r')"
          adb -s emulator-5554 shell wm size

      - name: Keep session alive
        shell: bash
        timeout-minutes: 350
        run: |
          set -euo pipefail
          END=$(( $(date +%s) + MINUTES * 60 ))
          echo "Interactive Android session is available for ${MINUTES} minutes."
          while (( $(date +%s) < END )); do
            adb -s emulator-5554 get-state >/dev/null
            sleep 60
          done

      - name: Upload diagnostic logs if the job fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-logs
          path: |
            emulator.log
            xvfb.log
            x11vnc.log
            novnc.log
            cloudflared.log
          if-no-files-found: ignore
          retention-days: 1
